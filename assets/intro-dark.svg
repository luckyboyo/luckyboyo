<svg xmlns="http://www.w3.org/2000/svg" width="600" height="70" viewBox="90 0 600 70" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Building AI agents. Connecting knowledge. Learning by building.</title>
  <desc id="desc">Three short lines type and erase in sequence. The first remains visible when reduced motion is preferred.</desc>
  <defs>
    <clipPath id="clip-one"><rect class="type one" x="143" y="16" width="514" height="37" style="--line-width:488px"/></clipPath>
    <clipPath id="clip-two"><rect class="type two" x="143" y="16" width="514" height="37" style="--line-width:422px"/></clipPath>
    <clipPath id="clip-three"><rect class="type three" x="143" y="16" width="514" height="37" style="--line-width:514px"/></clipPath>
    <style>
      .static { display: none; }
      .line { opacity: 0; animation: active 18s linear infinite; }
      .line.one { opacity: 1; }
      .type { animation: typing 18s steps(36,end) infinite; }
      .cursor { animation: travel 18s steps(36,end) infinite, blink .9s step-end infinite; }
      .two { animation-delay: 6s; }
      .three { animation-delay: 12s; }
      .line.two .cursor { animation-delay: 6s, 0s; }
      .line.three .cursor { animation-delay: 12s, 0s; }
      @keyframes active { 0%,33.32% { opacity: 1; } 33.33%,100% { opacity: 0; } }
      @keyframes typing { 0%,2% { width: 0; } 13%,25% { width: var(--line-width); } 31%,100% { width: 0; } }
      @keyframes travel { 0%,2% { transform: translateX(0); } 13%,25% { transform: translateX(var(--line-width)); } 31%,100% { transform: translateX(0); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .line,.type,.cursor { animation: none !important; }
        .line { display: none !important; }
        .static { display: inline !important; }
        .cursor { display: none; }
      }
    </style>
  </defs>
  <g font-family="Consolas, Liberation Mono, Menlo, monospace" font-size="22" font-weight="500">
    <text x="111" y="42" fill="#5EEAD4">&gt;</text>
    <text class="static" x="143" y="42" textLength="488" lengthAdjust="spacingAndGlyphs" fill="#B6CAE3">Building AI agents that work together.</text>
    <g class="line one">
      <text x="143" y="42" textLength="488" lengthAdjust="spacingAndGlyphs" fill="#B6CAE3" clip-path="url(#clip-one)">Building AI agents that work together.</text>
      <path class="cursor" d="M146 22V46" stroke="#5EEAD4" stroke-width="2" style="--line-width:488px"/>
    </g>
    <g class="line two">
      <text x="143" y="42" textLength="422" lengthAdjust="spacingAndGlyphs" fill="#B6CAE3" clip-path="url(#clip-two)">Connecting knowledge through RAG.</text>
      <path class="cursor" d="M146 22V46" stroke="#5EEAD4" stroke-width="2" style="--line-width:422px"/>
    </g>
    <g class="line three">
      <text x="143" y="42" textLength="514" lengthAdjust="spacingAndGlyphs" fill="#B6CAE3" clip-path="url(#clip-three)">Learning by building. One step at a time.</text>
      <path class="cursor" d="M146 22V46" stroke="#5EEAD4" stroke-width="2" style="--line-width:514px"/>
    </g>
  </g>
</svg>
