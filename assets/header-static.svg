<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Fang Ziyue · AI Agents, RAG and AI Engineering</title>
  <desc id="desc">An azure and mint banner with layered waves and a connected agent constellation. Static reduced-motion version. Build, learn, iterate.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="0.48" stop-color="#237CC6"/>
      <stop offset="1" stop-color="#53DAC8"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(1050 50) rotate(140) scale(660 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7F3E6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A7F3E6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="white" fill-opacity="0.13"/>
    </pattern>
    <clipPath id="canvas">
      <path d="M20 0H1180Q1200 0 1200 20V296C1000 276 820 277 598 300C379 323 168 309 0 291V20Q0 0 20 0Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1200" height="320" fill="url(#surface)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect class="ambient" width="1200" height="320" fill="url(#light)"/>
    <circle cx="1197" cy="-30" r="240" stroke="white" stroke-opacity="0.08"/>
    <circle cx="1197" cy="-30" r="186" stroke="white" stroke-opacity="0.09"/>
    <path class="wave-back" d="M-80 268C130 239 282 315 560 283C835 251 1030 235 1280 271V360H-80Z" fill="white" fill-opacity="0.08"/>
    <path class="wave" d="M-80 282C135 253 324 317 577 291C860 262 1049 264 1280 293V360H-80Z" fill="white" fill-opacity="0.13"/>
    <g class="intro" font-family="Segoe UI, Arial, sans-serif">
      <rect x="84" y="61" width="6" height="6" rx="3" fill="#A7F3D0"/>
      <text x="103" y="69" fill="#DCEEFF" font-size="12" font-weight="600" letter-spacing="3.2">BUILD · LEARN · ITERATE</text>
      <text x="80" y="155" fill="white" font-size="72" font-weight="700" letter-spacing="-2.5">Fang Ziyue</text>
    </g>
    <g class="sub" font-family="Segoe UI, Arial, sans-serif">
      <text x="84" y="202" fill="white" font-size="24" font-weight="500">AI Agents · RAG · AI Engineering</text>
      <path d="M84 235H126" stroke="#B5F4E4" stroke-width="3" stroke-linecap="round"/>
      <text x="141" y="240" fill="#DCEEFF" font-size="13" letter-spacing="1">from ideas to working systems</text>
    </g>
    <g class="constellation">
      <circle cx="970" cy="148" r="106" stroke="white" stroke-opacity="0.12"/>
      <circle cx="970" cy="148" r="76" stroke="white" stroke-opacity="0.19" stroke-dasharray="2 8"/>
      <path d="M892 84L970 148L1051 100M970 148L1033 224M970 148L874 205" stroke="#D8FFF3" stroke-opacity="0.32" stroke-width="1.4"/>
      <path class="signal" d="M892 84L970 148L1051 100M874 205L970 148L1033 224" stroke="#D8FFF3" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>
      <rect x="942" y="120" width="56" height="56" rx="18" fill="#E7FFF7" fill-opacity="0.13" stroke="#DCFFF3" stroke-opacity="0.55"/>
      <path d="M957 141L951 148L957 155M983 141L989 148L983 155M974 139L966 157" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="892" cy="84" r="9" fill="#E7FFF7" fill-opacity="0.17" stroke="#E7FFF7" stroke-opacity="0.8"/>
      <circle cx="1051" cy="100" r="7" fill="#D1FAE5"/>
      <circle cx="1033" cy="224" r="8" fill="#E7FFF7" fill-opacity="0.16" stroke="#E7FFF7" stroke-opacity="0.7"/>
      <circle cx="874" cy="205" r="6" fill="#D1FAE5" fill-opacity="0.9"/>
      <circle class="beacon" cx="1051" cy="100" r="13" stroke="#D1FAE5" stroke-opacity="0.45"/>
      <circle cx="1087" cy="195" r="2" fill="white" fill-opacity="0.65"/>
      <circle cx="928" cy="35" r="2" fill="white" fill-opacity="0.5"/>
    </g>
  </g>
</svg>
